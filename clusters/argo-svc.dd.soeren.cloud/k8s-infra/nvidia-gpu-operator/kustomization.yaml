---
apiVersion: "kustomize.config.k8s.io/v1beta1"
kind: "Kustomization"
resources:
  - ../../../../infra/nvidia-gpu-operator
components:
  - ../../../../infra/nvidia-gpu-operator/components/argo
patches:
  - target:
      kind: Application
      name: nvidia-gpu-operator
    # no driver container image exists for debian 13, driver is installed on the host.
    # k0s runs its own containerd with non-default config and socket paths.
    patch: |-
      - op: "replace"
        path: "/spec/source/helm/values"
        value: |
          # cdi spec generation can't resolve debian's absolute /etc/alternatives symlinks
          # from within the container, fall back to legacy mode (nvidia-container-cli)
          cdi:
            enabled: false
          driver:
            enabled: false
          toolkit:
            env:
              - name: CONTAINERD_CONFIG
                value: /etc/k0s/containerd.d/nvidia.toml
              - name: CONTAINERD_SOCKET
                value: /run/k0s/containerd.sock
              - name: CONTAINERD_RUNTIME_CLASS
                value: nvidia
