---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # ── SMTP service ────────────────────────────────────────────────
  service.email.smtp: |
    host: smtp.strato.de
    port: 587
    from: argo@soerensoerensen.de
    username: $email-username
    password: $email-password

  # ── Triggers ────────────────────────────────────────────────────
  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase in ['Succeeded']
      send: [app-sync-succeeded]

  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Failed', 'Error']
      send: [app-sync-failed]

  trigger.on-sync-running: |
    - when: app.status.operationState.phase in ['Running']
      send: [app-sync-running]

  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]

  trigger.on-deployed: |
    - when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
      send: [app-deployed]

  # ── Templates ───────────────────────────────────────────────────
  template.app-sync-succeeded: |
    email:
      subject: "[ArgoCD] ✅ {{.app.metadata.name}} synced successfully"
      body: |
        Application: {{.app.metadata.name}}
        Environment: {{.app.spec.destination.namespace}}
        Status: Sync succeeded
        Revision: {{.app.status.sync.revision}}
        {{if .app.status.operationState.message}}Message: {{.app.status.operationState.message}}{{end}}

        View in ArgoCD: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

  template.app-sync-failed: |
    email:
      subject: "[ArgoCD] ❌ {{.app.metadata.name}} sync FAILED"
      body: |
        Application: {{.app.metadata.name}}
        Environment: {{.app.spec.destination.namespace}}
        Status: Sync failed
        Revision: {{.app.status.sync.revision}}
        {{if .app.status.operationState.message}}Error: {{.app.status.operationState.message}}{{end}}

        View in ArgoCD: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

  template.app-sync-running: |
    email:
      subject: "[ArgoCD] 🔄 {{.app.metadata.name}} sync started"
      body: |
        Application: {{.app.metadata.name}}
        Environment: {{.app.spec.destination.namespace}}
        Status: Sync in progress
        Revision: {{.app.status.sync.revision}}

        View in ArgoCD: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

  template.app-health-degraded: |
    email:
      subject: "[ArgoCD] ⚠️ {{.app.metadata.name}} health DEGRADED"
      body: |
        Application: {{.app.metadata.name}}
        Environment: {{.app.spec.destination.namespace}}
        Health: Degraded
        {{if .app.status.conditions}}
        Conditions:
        {{range .app.status.conditions}}  - {{.type}}: {{.message}}
        {{end}}{{end}}
        View in ArgoCD: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

  template.app-deployed: |
    email:
      subject: "[ArgoCD] 🚀 {{.app.metadata.name}} deployed successfully"
      body: |
        Application: {{.app.metadata.name}}
        Environment: {{.app.spec.destination.namespace}}
        Status: Deployed and healthy
        Revision: {{.app.status.sync.revision}}

        View in ArgoCD: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

  # ── Global subscriptions (applies to ALL apps — no per-app annotation needed) ──
  subscriptions: |
    - recipients:
        - email:k8s@soerensoerensen.de
      triggers:
        - on-sync-succeeded
        - on-sync-failed
        - on-sync-running
        - on-health-degraded
        - on-deployed
