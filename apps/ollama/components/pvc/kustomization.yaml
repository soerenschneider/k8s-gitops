---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ollama-pvc.yaml
patches:
  - target:
      kind: StatefulSet
      name: ollama
    patch: |
      - op: test
        path: /spec/template/spec/volumes/0/name
        value: models
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: models
          persistentVolumeClaim:
            claimName: ollama-models
