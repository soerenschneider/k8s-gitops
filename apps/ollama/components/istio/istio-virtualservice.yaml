---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: ollama
spec:
  hosts:
    - ollama
  gateways:
    - istio-system/gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: ollama
            port:
              number: 80
